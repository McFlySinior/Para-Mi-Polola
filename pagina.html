<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>🖤 Para Mi Polola 🖤</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap");

    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0d0d0d 0%, #000 100%);
      color: #f5f5f5;
      font-family: "Poppins", sans-serif;
      text-align: center;
      position: relative;
    }

    h1 {
      font-weight: 400;
      font-size: 1.3em;
      max-width: 80%;
      margin: 0 20px 25px;
      line-height: 1.6em;
      transition: opacity 1s ease;
      z-index: 3;
      color: #f5f5f5;
      text-shadow: 0 0 12px rgba(255,255,255,0.15);
    }

    button {
      background: linear-gradient(90deg, #111, #333);
      color: white;
      border: 1px solid #555;
      border-radius: 40px;
      padding: 14px 45px;
      font-size: 1em;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.4s ease;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(255,255,255,0.1);
      z-index: 3;
    }

    button:hover {
      background: #000;
      transform: scale(1.07);
      box-shadow: 0 0 25px rgba(255,255,255,0.3);
    }

    .corazon {
      position: absolute;
      color: rgba(255, 255, 255, 0.08);
      font-size: 20px;
      user-select: none;
      animation: caer 6s linear forwards;
      z-index: 1;
    }

    @keyframes caer {
      0% { transform: translateY(-10px) scale(1); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(110vh) scale(0.7); opacity: 0; }
    }

    /* Fondo de imágenes */
    .galeria {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 0;
    }

    .galeria img {
      position: absolute;
      width: 65%;
      height: auto;
      max-height: 80%;
      object-fit: contain;
      border-radius: 10px;
      opacity: 0;
      transition: opacity 1s ease;
      filter: grayscale(70%) brightness(0.8) contrast(1.1);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
    }

    .galeria img.activa {
      opacity: 1;
    }

    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(2px);
      background: rgba(0, 0, 0, 0.45);
      z-index: 2;
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.85em;
      color: #888;
      opacity: 0.9;
      z-index: 3;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="galeria">
    <img src="1.jpeg" class="activa">
    <img src="2.jpeg">
    <img src="3.jpeg">
    <img src="4.jpeg">
  </div>

  <div class="overlay"></div>

  <h1 id="frase">🖤 Surfeando en tu ola envuelto en tu calma... 🖤</h1>
  <button onclick="cambiarFrase()">Cambiar frase</button>
  <footer>Felices 4 meses mi vale hermosa, gracias por hacerme feliz dia tras dia te amo muchisimo pero muchisimo. 🖤</footer>

  <script>
    const frases = [
      "Surfeando en tu ola envuelto en tu calma y tus brazos sobre mi cabeza en tu ola me mantuviste, me diste calma con tus brazos sobre mi cabeza",
      "Quédate conmigo mientras cruzamos los cielos vacíos ven a navegar conmigo jugamos en los sueños mientras cruzamos el espacio y el tiempo solo quédate conmigo",
      "Desde el día en que llegas me quedaré a tu lado colocado en el interior, sano y salvo",
      "Nuestra mirada es la fuerza más linda de todas quiero esconderme en tu pecho, que nada me joda",
      "Junta tu rostro mojado con el mío nunca me quites ese embrujo tuyo",
      "Acércate Juntemos pieles formando sombras y olvídate de tus misterios, de una razón enciérrame en tus suspiros, en tus sueños y ráptame rompamos juntos esta evasión",
      "Empújame al abismo que hay en ti atrévete a hacer historias, junto a mí enséñame las cosas que nunca entendí",
      "Te necesito más que cualquier cosa en mi vida te deseo más que a cualquier cosa en mi vida te extrañaré más que a nadie en mi vida te amo más que a nadie en mi vida"
    ];

    const frase = document.getElementById("frase");
    const imagenes = document.querySelectorAll(".galeria img");
    let indice = 0;

    function cambiarFrase() {
      // Cambia frase
      frase.style.opacity = 0;
      setTimeout(() => {
        indice = (indice + 1) % frases.length;
        frase.textContent = "🖤 " + frases[indice] + " 🖤";
        frase.style.opacity = 1;
      }, 500);

      // Cambia imagen sincronizada
      imagenes.forEach((img, i) => img.classList.remove("activa"));
      imagenes[indice % imagenes.length].classList.add("activa");
    }

    // Corazones cayendo
    function crearCorazon() {
      const corazon = document.createElement("div");
      corazon.classList.add("corazon");
      corazon.textContent = "🖤";
      corazon.style.left = Math.random() * 100 + "vw";
      corazon.style.fontSize = (10 + Math.random() * 30) + "px";
      corazon.style.animationDuration = (3 + Math.random() * 5) + "s";
      document.body.appendChild(corazon);
      setTimeout(() => corazon.remove(), 6000);
    }
    setInterval(crearCorazon, 300);
  </script>

</body>
</html>
